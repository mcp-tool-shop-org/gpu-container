[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpu-container"
version = "0.1.1"
description = "Model-aware inference memory-placement planner for single-GPU rigs — profile, plan, prove."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "mcp-tool-shop", email = "64996768+mcp-tool-shop@users.noreply.github.com" }]
keywords = ["llm", "inference", "gpu", "moe", "offload", "vram", "placement", "profiler"]
dependencies = []

[project.optional-dependencies]
# Richer GPU introspection (NVML v2); the profiler falls back to nvidia-smi if absent.
# nvidia-ml-py is NVIDIA's maintained binding and provides `import pynvml`.
gpu = ["nvidia-ml-py>=12.535.0"]
host = ["psutil>=5.9.0", "numpy>=1.24"]
dev = ["pytest>=8.0"]

[project.scripts]
gpu-container = "gpu_container.__main__:main"
gpu-container-profile = "gpu_container.profiler.cli:main"
gpu-container-plan = "gpu_container.planner.cli:main"
gpu-container-receipt = "gpu_container.planner.receipt_cli:main"
gpu-container-concentration = "gpu_container.planner.concentration_cli:main"
gpu-container-watchdog = "gpu_container.watchdog:main"

[tool.hatch.build.targets.wheel]
packages = ["gpu_container"]

[tool.pytest.ini_options]
testpaths = ["tests"]
